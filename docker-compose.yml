# getarp.net Defence Intelligence PoC — single-VM orchestration
# Four networks enforce strict isolation:
#   honeypot_net : internet-facing deception. NO member also on data_net/egress_net.
#   data_net     : internal-only (no internet). Postgres, Redis, pipeline, analytics.
#   egress_net   : outbound-only for services needing external CTI APIs (enrichment, crowdsec).
#   frontend_net : edge reverse proxy + api + ui.
#
# NOTE: The cs-firewall-bouncer is intentionally NOT a Docker service — there is no
# official Docker image. It runs as a host-native systemd service, installed and wired
# to the CrowdSec LAPI by bootstrap.sh / setup.sh.

# A note on deploy.resources.limits below: they are caps, not reservations, and
# they deliberately sum to more than the 8 GB VM. Measured steady-state usage
# across the whole stack is ~1.4 GB; the caps exist to stop one runaway service
# taking the host down, so each is sized for that service's worst case rather
# than for a share of the total. The two that behave like reservations in
# practice — postgres (shared_buffers) and suricata — are sized to fit
# together with room to spare.
x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  honeypot_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true          # sealed: no internet egress (Postgres/Redis never reach out)
  egress_net:
    driver: bridge          # outbound internet for CTI lookups and CrowdSec CAPI sync
  frontend_net:
    driver: bridge
    ipam:
      config:
        # Pinned so the API can trust XFF only from this proxy network (Caddy).
        # Keep in sync with TRUSTED_PROXIES on the api service.
        - subnet: 172.19.0.0/16
  ops_net:
    driver: bridge
    internal: true          # api <-> docker-proxy only; keeps the socket proxy off data_net

volumes:
  honeypot_logs:            # written by sensors, read-only to consumers
  pipeline_state:           # ingestor read offsets; see pipeline/ingestor.py
  pgdata:
  crowdsec_data:
  crowdsec_config:
  caddy_data:
  geoip_data:               # GeoLite2 databases for the enrichment geolite feed

services:
  # Restricted Docker socket proxy — read-only container/image inspection plus
  # container restarts, nothing else. POST stays 0 so /containers/create and
  # /containers/{id}/exec are denied even if the API container is compromised;
  # ALLOW_RESTARTS only whitelists /containers/{id}/(stop|restart|kill).
  # Lives on its own internal network so only the API can reach it.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    networks: [ops_net]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1           # GET /containers/* (list, inspect, logs)
      IMAGES: 1               # GET /images/* (versions view)
      POST: 0                 # deny all writes...
      ALLOW_RESTARTS: 1       # ...except stop/restart/kill
      LOG_LEVEL: warning
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    logging: *default-logging

  # ───────────────────────── DECEPTION (isolated) ─────────────────────────
  cowrie:
    image: cowrie/cowrie:latest      # no versioned tags available upstream
    restart: unless-stopped
    networks: [honeypot_net]
    ports:
      - "22:2222"           # real sshd MUST be moved to a mgmt port (see setup.sh)
    volumes:
      - ./honeypot/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./honeypot/cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - honeypot_logs:/cowrie/cowrie-git/var/log/cowrie
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    logging: *default-logging

  extra-services:
    build: ./honeypot/extra-services
    restart: unless-stopped
    networks: [honeypot_net]
    ports:
      - "80:8080"
      - "8081:8081"         # alt http
      - "3306:3306"         # fake MySQL "DB"
      - "21:2121"           # ftp
      - "6379:6379"         # redis
    volumes:
      - honeypot_logs:/var/log/honeypot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *default-logging

  # ───────────────────────────── DETECTION ────────────────────────────────
  suricata:
    image: jasonish/suricata:7.0
    restart: unless-stopped
    network_mode: host        # needs to see the real public NIC via AF_PACKET
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    security_opt: ["no-new-privileges:true"]
    command: -i ${PUBLIC_IFACE} --set sensor-name=getarp
    volumes:
      # not :ro — the official entrypoint chowns these to the suricata user on
      # startup (set -e), so a read-only mount makes the container crash-loop
      - ./ids/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./ids/suricata/rules:/etc/suricata/rules
      - honeypot_logs:/var/log/suricata
    deploy:
      resources:
        # sized for a 4 vCPU / 8 GB VM; detect.profile=low + 2 af-packet
        # threads keep Suricata well under this in practice (~50-500 MB)
        limits: { cpus: "1.5", memory: 2G }
    logging: *default-logging

  # ──────────────────── INTEL + ENFORCEMENT (CrowdSec) ────────────────────
  # CrowdSec LAPI — detection engine + community CTI sync (needs egress_net for CAPI)
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    restart: unless-stopped
    networks: [data_net, egress_net]    # data_net: talks to nothing on internet;
                                        # egress_net: pulls collections + syncs CAPI
    ports:
      - "127.0.0.1:8080:8080"           # LAPI bound to loopback only for host bouncer
    environment:
      COLLECTIONS: "crowdsecurity/suricata crowdsecurity/sshd crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      PARSERS: "crowdsecurity/cowrie-logs"
      CUSTOM_HOSTNAME: getarp
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./crowdsec/whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/getarp-whitelist.yaml:ro
      - honeypot_logs:/var/log/honeypot:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *default-logging

  # NOTE: cs-firewall-bouncer is a HOST service (no official Docker image exists).
  # setup.sh installs it via apt and wires it to the LAPI above on 127.0.0.1:8080.
  # See deploy/bootstrap.sh for the installation steps.

  # ──────────────────────────── BUS + STORAGE ─────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    networks: [data_net]
    # maxmemory must stay comfortably under the container limit below, or the
    # OOM killer wins the race against Redis's own LRU eviction. Streams are
    # additionally trimmed via MAXLEN at the producer (measured usage: ~11 MB).
    command: redis-server --save "" --requirepass ${REDIS_PASSWORD} --maxmemory 384mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 512M }
    logging: *default-logging

  postgres:
    image: timescale/timescaledb:2.27.2-pg16
    restart: unless-stopped
    networks: [data_net]
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PGOPTIONS: >-
        -c app.pipeline_password=${SVC_PIPELINE_PASSWORD:-}
        -c app.enrichment_password=${SVC_ENRICHMENT_PASSWORD:-}
        -c app.analytics_password=${SVC_ANALYTICS_PASSWORD:-}
        -c app.api_password=${SVC_API_PASSWORD:-}
    # Pinned tuning for a 4 vCPU / 8 GB VM. Without these the timescaledb image
    # auto-tunes on first boot and writes postgresql.conf *into the pgdata
    # volume*, so the settings are a property of whichever host created the
    # volume rather than of this repo — this deployment inherited a 15.6 GB
    # profile (shared_buffers 3.9 GB, work_mem 61 MB, max_connections 100) that
    # does not fit the target VM and would not travel with a restored volume.
    # Command-line flags override postgresql.conf, so these win on any host.
    # Re-tune deliberately if the VM is resized — they will NOT auto-adjust.
    #
    # work_mem is per sort/hash node, not per connection: the service pools sum
    # to 32 connections (api 10 + analytics 10 + pipeline 8 + enrichment 4), so
    # max_connections 50 is ample and keeps the worst case bounded. 16 MB still
    # leaves the widest join in the app (the /api/ips hash, measured 3.9 MB)
    # single-batch.
    #
    # max_worker_processes must cover timescaledb.max_background_workers +
    # max_parallel_workers + a few spare, hence 8 + 2 + 3.
    command: >-
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=4GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c max_connections=50
      -c max_worker_processes=13
      -c timescaledb.max_background_workers=8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        # sized for a 4 vCPU / 8 GB VM — leaves room for Suricata + the
        # Python services; raise if the VM grows. Must stay above
        # shared_buffers + maintenance_work_mem + (work_mem x concurrent sorts)
        # with headroom; at 2 GB + 512 MB pinned above, 3 GB is the floor.
        limits: { cpus: "2", memory: 3G }
    logging: *default-logging

  # ─────────────────── INGEST / ENRICH / ANALYTICS ────────────────────────
  # The three Python workers below share a liveness mechanism: each concurrent
  # loop touches a file under /tmp/health on every iteration, an in-process
  # watchdog exits the process when one goes stale, and the healthcheck here
  # reports the same state to `docker ps`.
  #
  # The watchdog is what actually restarts a hang. Compose does not act on
  # health status — `restart: unless-stopped` fires on process exit only, so an
  # unhealthy container would otherwise sit there unhealthy for ever. See
  # pipeline/heartbeat.py and the README.
  pipeline:
    build: ./pipeline
    restart: unless-stopped
    networks: [data_net]
    # Pinned to match the Dockerfile rather than inherited from it: with a
    # numeric uid Docker skips the image's passwd lookup, so the sensorlogs
    # membership that makes the read-only log volume readable has to be granted
    # explicitly here. 999 = sensorlogs, the group that owns honeypot_logs.
    user: "1000:1000"
    group_add: ["999"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp/health"]      # heartbeats never touch disk
    healthcheck:
      # Interval sits just under the tail threshold (60s) so a stall is caught
      # within roughly one threshold; retries then require three consecutive
      # failures, i.e. ~90s of genuinely stalled ingest before it is reported.
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      SVC_DB_USER: svc_pipeline
      SVC_DB_PASSWORD: ${SVC_PIPELINE_PASSWORD:-}
      SENSOR_PUBLIC_IP: ${SENSOR_PUBLIC_IP:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      INGEST_QUEUE_MAX: ${INGEST_QUEUE_MAX:-2000}
      INGEST_CONSUMERS: ${INGEST_CONSUMERS:-3}
      INGEST_ITEM_MAX_ATTEMPTS: ${INGEST_ITEM_MAX_ATTEMPTS:-4}
      PIPELINE_TAIL_STALE_S: ${PIPELINE_TAIL_STALE_S:-60}
      PIPELINE_CONSUMER_STALE_S: ${PIPELINE_CONSUMER_STALE_S:-120}
      BACKOFF_BASE_S: ${BACKOFF_BASE_S:-1}
      BACKOFF_MAX_S: ${BACKOFF_MAX_S:-60}
      REDIS_SOCKET_TIMEOUT_S: ${REDIS_SOCKET_TIMEOUT_S:-30}
      REDIS_CONNECT_TIMEOUT_S: ${REDIS_CONNECT_TIMEOUT_S:-10}
      PG_COMMAND_TIMEOUT_S: ${PG_COMMAND_TIMEOUT_S:-30}
      PG_CONNECT_TIMEOUT_S: ${PG_CONNECT_TIMEOUT_S:-10}
    volumes:
      - honeypot_logs:/data/logs:ro      # READ-ONLY: one-way telemetry crossing the boundary
      # Read offsets. The log volume is deliberately read-only, so the
      # checkpoints that let a restart resume instead of skipping ahead need
      # somewhere else to live. Nothing else mounts this.
      - pipeline_state:/var/lib/pipeline
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        # 384M, up from 256M. Steady state is ~26 MB; the ceiling is the
        # in-flight queue, which holds raw sensor records — a Suricata alert
        # carries its payload, so a queued record is kilobytes. INGEST_QUEUE_MAX
        # (2000, was 10000) caps that at a few tens of MB, and CPython does not
        # hand freed arenas back to the OS, so a single flood sets the resident
        # size for the rest of the container's life. The headroom is for that
        # high-water mark, not for steady state.
        limits: { cpus: "0.5", memory: 384M }
    logging: *default-logging

  enrichment:
    build: ./enrichment
    restart: unless-stopped
    networks: [data_net, egress_net]    # data_net: Redis/Postgres; egress_net: CTI APIs
    user: "1000:1000"       # pinned; no sensorlogs group — reads no log volume
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp/health"]
    healthcheck:
      # Looser than the pipeline's: a Tier-2 chain is several provider calls
      # with their own timeouts, and the feed loops legitimately go minutes
      # between beats (see ENRICH_*_STALE_S in .env.example).
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      SVC_DB_USER: svc_enrichment
      SVC_DB_PASSWORD: ${SVC_ENRICHMENT_PASSWORD:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-tiered}
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY}
      CROWDSEC_CTI_KEY: ${CROWDSEC_CTI_KEY:-}
      ABUSEIPDB_KEY: ${ABUSEIPDB_KEY:-}
      ABUSECH_KEY: ${ABUSECH_KEY:-}
      GREYNOISE_KEY: ${GREYNOISE_KEY:-}
      VIRUSTOTAL_KEY: ${VIRUSTOTAL_KEY:-}
      VT_ENABLE: ${VT_ENABLE:-false}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      FEED_REFRESH_HOURS: ${FEED_REFRESH_HOURS:-3}
      ENRICHMENT_CACHE_TTL_DAYS: ${ENRICHMENT_CACHE_TTL_DAYS:-14}
      TIER2_MIN_EVENTS: ${TIER2_MIN_EVENTS:-10}
      TIER2_MIN_THREAT_SCORE: ${TIER2_MIN_THREAT_SCORE:-30}
      TIER2_HIGH_THREAT_SCORE: ${TIER2_HIGH_THREAT_SCORE:-60}
      ABUSEIPDB_DAILY_QUOTA: ${ABUSEIPDB_DAILY_QUOTA:-900}
      GREYNOISE_429_COOLDOWN: ${GREYNOISE_429_COOLDOWN:-21600}
      FEED_STORE_CHUNK: ${FEED_STORE_CHUNK:-1000}
      ENRICH_MAX_ATTEMPTS: ${ENRICH_MAX_ATTEMPTS:-5}
      ENRICH_RECLAIM_IDLE_S: ${ENRICH_RECLAIM_IDLE_S:-300}
      ENRICH_CONSUME_STALE_S: ${ENRICH_CONSUME_STALE_S:-300}
      # No default here, unlike the threshold above: these two derive theirs
      # from the refresh intervals they watch (interval * 2), so pinning a
      # number in compose would silently break that link the moment someone
      # changed FEED_REFRESH_HOURS. Blank means "use the derived default" —
      # heartbeat.env_seconds() treats an empty value as unset.
      ENRICH_REFRESH_STALE_S: ${ENRICH_REFRESH_STALE_S:-}
      ENRICH_FEEDS_STALE_S: ${ENRICH_FEEDS_STALE_S:-}
      HTTP_CONNECT_TIMEOUT_S: ${HTTP_CONNECT_TIMEOUT_S:-5}
      HTTP_READ_TIMEOUT_S: ${HTTP_READ_TIMEOUT_S:-15}
      BACKOFF_BASE_S: ${BACKOFF_BASE_S:-1}
      BACKOFF_MAX_S: ${BACKOFF_MAX_S:-60}
      REDIS_SOCKET_TIMEOUT_S: ${REDIS_SOCKET_TIMEOUT_S:-30}
      REDIS_CONNECT_TIMEOUT_S: ${REDIS_CONNECT_TIMEOUT_S:-10}
      PG_COMMAND_TIMEOUT_S: ${PG_COMMAND_TIMEOUT_S:-30}
      PG_CONNECT_TIMEOUT_S: ${PG_CONNECT_TIMEOUT_S:-10}
    volumes:
      - geoip_data:/geoip                 # GeoLite2 .mmdb files (see enrichment/feeds.py)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      crowdsec:
        condition: service_started
    deploy:
      resources:
        # 768M, up from 512M. Steady state is ~122 MB, but the peak is during a
        # feed refresh and that is what gets OOM-killed: the CrowdSec CAPI
        # blocklist (~25k decisions) and ThreatFox's 7-day window are held as
        # in-memory indexes, refresh() builds a full second copy before
        # swapping, and the GeoLite2 archives are tens of MB each. The code now
        # streams those downloads to disk and inserts in FEED_STORE_CHUNK
        # batches, which removes the two largest spikes; this covers what
        # remains — an index, its replacement, and two open .mmdb readers at
        # once. An OOM here looks random precisely because it only happens on
        # the refresh tick.
        limits: { cpus: "0.5", memory: 768M }
    logging: *default-logging

  analytics:
    build: ./analytics
    restart: unless-stopped
    networks: [data_net]
    user: "1000:1000"       # pinned; no sensorlogs group — reads no log volume
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp/health"]
    healthcheck:
      # The loosest of the three, and deliberately so: the status loop ticks
      # once every STATUS_INTERVAL_SECONDS (300s), so its threshold is two
      # intervals plus slack. The consume and flush loops are held to 120s
      # inside the same check, so a wedged consumer is still caught quickly.
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      SVC_DB_USER: svc_analytics
      SVC_DB_PASSWORD: ${SVC_ANALYTICS_PASSWORD:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENABLED_DETECTORS: ${ENABLED_DETECTORS:-scan,attack}
      ENABLED_PROFILERS: ${ENABLED_PROFILERS:-default}
      STATUS_INTERVAL_SECONDS: ${STATUS_INTERVAL_SECONDS:-300}
      REPORT_CRON_HOUR: ${REPORT_CRON_HOUR:-6}
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:-}
      WINDOW_MAX_EVENTS: ${WINDOW_MAX_EVENTS:-500}
      WINDOW_MAX_IPS: ${WINDOW_MAX_IPS:-5000}
      PROFILE_MAX_IPS: ${PROFILE_MAX_IPS:-20000}
      ANALYTICS_CONSUME_STALE_S: ${ANALYTICS_CONSUME_STALE_S:-120}
      ANALYTICS_FLUSH_STALE_S: ${ANALYTICS_FLUSH_STALE_S:-120}
      # Blank on purpose — derived from STATUS_INTERVAL_SECONDS (x2 + slack),
      # so a compose-side number would go stale if that interval changed.
      ANALYTICS_STATUS_STALE_S: ${ANALYTICS_STATUS_STALE_S:-}
      BACKOFF_BASE_S: ${BACKOFF_BASE_S:-1}
      BACKOFF_MAX_S: ${BACKOFF_MAX_S:-60}
      REDIS_SOCKET_TIMEOUT_S: ${REDIS_SOCKET_TIMEOUT_S:-30}
      REDIS_CONNECT_TIMEOUT_S: ${REDIS_CONNECT_TIMEOUT_S:-10}
      PG_COMMAND_TIMEOUT_S: ${PG_COMMAND_TIMEOUT_S:-60}
      PG_CONNECT_TIMEOUT_S: ${PG_CONNECT_TIMEOUT_S:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        # 640M, up from 512M. Steady state is ~30 MB, but the in-memory
        # correlation state scales with concurrent attackers: a per-IP deque of
        # events, each a kilobyte or so, for every source seen in the last five
        # minutes. Both dimensions are now capped (WINDOW_MAX_EVENTS,
        # WINDOW_MAX_IPS, PROFILE_MAX_IPS), which bounds the worst case at a few
        # hundred MB instead of leaving it open-ended; this sits above that
        # bound with room for the daily report queries.
        limits: { cpus: "0.5", memory: 640M }
    logging: *default-logging

  # ─────────────────────────── API + UI + EDGE ────────────────────────────
  api:
    build: ./api
    restart: unless-stopped
    networks: [data_net, frontend_net, ops_net]
    # Same pinning as the pipeline: this container also mounts honeypot_logs
    # read-only, so it needs the sensorlogs group to keep reading sensor logs
    # whose mode does not happen to include world-read.
    user: "1000:1000"
    group_add: ["999"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      SVC_DB_USER: svc_api
      SVC_DB_PASSWORD: ${SVC_API_PASSWORD:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY}
      DOCKER_HOST: tcp://docker-proxy:2375
      # Honor X-Forwarded-For only from Caddy on frontend_net (see api/ratelimit.py).
      # Must match the frontend_net subnet pinned under networks:.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.19.0.0/16}
    volumes:
      - ./docs:/app/docs:ro
      - honeypot_logs:/data/logs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    networks: [frontend_net]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    networks: [frontend_net]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    environment:
      ADMIN_IP: ${ADMIN_IP}
    ports:
      - "443:443"
      # Caddy's :80 exists only for local/ACME fallback; ACME itself uses
      # TLS-ALPN on 443. Bound to loopback so it is not internet-exposed —
      # Docker's DNAT bypasses UFW, so a 0.0.0.0 publish would be reachable
      # regardless of the firewall allowlist.
      - "127.0.0.1:8443:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, frontend]
    logging: *default-logging
